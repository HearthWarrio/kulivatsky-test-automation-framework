name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    name: Core build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify core build
        run: sh ./mvnw -B -ntp clean verify

  integration:
    name: PostgreSQL and Kafka integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run container-backed integration example
        run: sh ./mvnw -B -ntp -e -DtrimStackTrace=false test -Pintegration -Dgroups=container
      - name: Print integration test report on failure
        if: failure()
        run: cat target/surefire-reports/*.txt 2>/dev/null || true

  ui:
    name: Headless UI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run headless UI example
        run: sh ./mvnw -B -ntp -e -DtrimStackTrace=false test -Pui -Dgroups=ui -Dselenide.headless=true
      - name: Print UI test report on failure
        if: failure()
        run: cat target/surefire-reports/*.txt 2>/dev/null || true
